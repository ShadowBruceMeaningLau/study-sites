<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物理学 · 本科互动学习站</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="app/app.css">
<script src="vendor/katex/katex.min.js"></script>
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">⚛</div>
      <div class="brand-text">
        <strong>物理学</strong>
        <span>本科互动学习站</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="ring-wrap" id="ringWrap">
        <svg viewBox="0 0 42 42" class="ring"><circle class="ring-bg" cx="21" cy="21" r="18"></circle><circle class="ring-fg" id="ringFg" cx="21" cy="21" r="18"></circle></svg>
        <div class="ring-label"><b id="ringPct">0%</b><span>总进度</span></div>
      </div>
      <div class="foot-actions">
        <button class="btn ghost sm" id="btnReview" title="从错题和最薄弱的课里随机抽题">🔁 复习</button>
        <button class="btn ghost sm" id="btnNotebook" title="错题本">📕 错题本</button>
        <button class="btn ghost sm" id="btnTheme" title="切换深色 / 浅色">🌗</button>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <button class="btn ghost icon only-mobile" id="btnMenu" aria-label="菜单">☰</button>
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-search">
        <input id="search" type="search" placeholder="搜索课程 / 定律 / 知识点（按 / 聚焦）" autocomplete="off">
        <div class="search-pop" id="searchPop" hidden></div>
      </div>
      <div class="topbar-actions">
        <span class="sync-badge" id="syncBadge" hidden></span>
        <button class="btn ghost sm" id="btnReport" title="导出 Markdown 学习报告">📄 报告</button>
        <button class="btn ghost sm" id="btnData" title="导出 / 导入学习进度">💾 数据</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="toast-host" id="toastHost"></div>
